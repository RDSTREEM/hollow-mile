dialogues:
  station_keeper:
    start: greeting

    nodes:
      greeting:
        text: >
          "Ah. There you are."

          He looks up from his clipboard.

          "I was beginning to wonder whether you'd arrived."

          He studies you for a moment.

          "First time here?"

          He doesn't wait for an answer.

          "Well. It usually is."

          He returns to his clipboard.
        choices:
          - text: "Where am I?"
            next: location

          - text: "How do I leave?"
            next: departure

          - text: "What time is it?"
            next: time

          - text: "Who are you?"
            next: identity

          - text: "What's on your clipboard?"
            next: clipboard

          - text: "Never mind."
            response: >
              "Of course."
            next: null

      location:
        text: >
          "HOLLOW MILE. Small station. Not particularly well
          known."

          He glances towards the brass sign.

          "Though I suppose you've already noticed that."

          He makes a small mark on his clipboard.
        choices:
          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null

      departure:
        text: >
          "The trains come and go."

          He checks his watch.

          "Eventually."

          He makes a small mark on his clipboard.

          "You'll have to wait for the next one."
        choices:
          - text: "When is the next train?"
            next: next_train

          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null

      next_train:
        text: >
          "I couldn't tell you."

          He looks up at the departure board.

          "The board usually knows before I do."

          He pauses.

          "Though it has been rather unreliable lately."
        choices:
          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null

      time:
        text: >
          "Eleven forty-seven."

          He looks at the clock.

          "It has been eleven forty-seven for some time."

          He seems entirely unsurprised by this.
        choices:
          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null

      identity:
        text: >
          "Arthur Bell. Station keeper."

          He adjusts his glasses.

          "I look after the place."

          He looks down at his clipboard again.
        choices:
          - text: "How long have you worked here?"
            next: employment

          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null

      employment:
        text: >
          "Long enough."

          He considers the question.

          "Longer than I intended, perhaps."

          He turns a page on his clipboard.
        choices:
          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null

      clipboard:
        text: >
          He turns the clipboard slightly away.

          "Station records. Nothing you'd need to worry
          about."

          You catch a glimpse of several columns of names
          and dates.

          Some of the dates appear to be decades old.
        choices:
          - text: "What are the names?"
            next: names

          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null

      names:
        text: >
          Arthur closes the clipboard.

          "Passengers. Arrivals. Departures."

          He looks at you.

          "It's important to keep records."

          He doesn't elaborate.
        choices:
          - text: "Ask something else."
            next: greeting

          - text: "That's all."
            response: >
              "Very well."
            next: null
