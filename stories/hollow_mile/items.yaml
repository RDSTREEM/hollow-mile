items:
  brass_key:
    name: Brass Key
    description: >
      A small brass key. Its handle bears the number 03.
      Someone has scratched a tiny arrow into its surface.

    aliases:
      - key
      - old key

    portable: true
    location: platform

  noticeboard:
    name: Noticeboard
    description: >
      A faded timetable is pinned beneath a layer of dust.
      Most of the printed dates have been scratched away.

    aliases:
      - board

    location: ticket_hall

  station_clock:
    name: Station Clock
    description: >
      An old railway clock. Its hands are frozen at 11:47.
      Behind the glass, something appears to have been written on the clock face.

    aliases:
      - clock

    entity_type: object
    location: ticket_hall

  maintenance_cabinet:
    name: Maintenance Cabinet
    description: >
      A heavy metal cabinet stands against the wall.
      Its small lock is marked with the number 03.
      It refuses to open.

    aliases:
      - cabinet
      - locked cabinet

    entity_type: object
    location: maintenance_office

    interactions:
      use:
        brass_key:
          condition:
            flag: open
            equals: false

          text: >
            The brass key fits perfectly.
            You turn it. A metallic click echoes through the office and the cabinet opens.

            Inside lies a folded railway document.

          failure_text: >
            The cabinet is already open

          set_flags:
            open: true

          increment_variables:
            documents_found: 1

          emit: cabinet_opened

      variants:
        - condition:
            flag: open
            equals: true

          text: >
            The metal cabinet hangs open. Inside, an empty space marks where something was stored. A folded railway document lies on the shelf.

  railway_document:
    name: Railway Document
    description: >
      A folded railway document, yellowed with age.
      The heading reads: HOLLOW MILE - INTERNAL
      MAINTENANCE RECORD. Several lines have been crossed out in red ink.
    aliases:
      - document
      - railway record
      - paper

    portable: true
    location: maintenance_office
    visible_when:
      flag: open
      equals: true
