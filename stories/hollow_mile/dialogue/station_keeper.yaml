dialogues:
  station_keeper:
    start: greeting

    nodes:
      greeting:
        text: |
          The station keeper looks up from his desk.

          "You're not supposed to be here."

        choices:
          - text: "Where am I?"
            next: location

          - text: "Who are you?"
            next: identity

          - text: "I should go."
            next: null

      location:
        text: |
          "That depends," he says.
          "When did you arrive?"

        choices:
          - text: "I don't remember."
            next: confused

          - text: "Never mind."
            next: greeting

      confused:
        text: |
          He studies you for a moment.

          "Then perhaps you should start remembering."

        choices:
          - text: "What does that mean?"
            next: warning

          - text: "Goodbye."
            next: null

      warning:
        text: |
          "This station has a habit of keeping things."

          He returns to his paperwork.

        choices: []

      identity:
        text: |
          "I keep this station running."

          He pauses.

          "Or at least, I used to."

        choices:
          - text: "What happened?"
            next: warning

          - text: "Goodbye."
            next: null
